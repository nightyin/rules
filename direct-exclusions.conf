# Policy-owned rules excluded from the generated fallback DIRECT list.
#
# RULE-SET entries may be HTTPS URLs or local:<path> references. Only domain
# and IP-CIDR rules are used by the generator. Sources are fail-closed: if one
# cannot be loaded, direct.list is not updated.
#
# WeChat and MeiTuan are intentionally not listed because their configured
# policy is DIRECT. Their overlap with the fallback DIRECT list is harmless.

